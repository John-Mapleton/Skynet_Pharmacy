[build]
  command = "vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# All app data + AI calls go through one function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single-page app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
